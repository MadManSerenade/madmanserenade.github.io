<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>MadManSerenade</title>
    </head>
    <body>
        <div class="grid grid-cols-1 sm:grid-cols-12 lg:grid-cols-16 xl:grid-cols-20">
            <aside class="sticky top-0 sm:col-span-2 sm:max-h-dvh bg-amber-200"></aside>
            <div class="col-span-1 sm:col-span-8 lg:col-span-12 xl:col-span-16 min-h-dvh bg-gray-900">
                <header class="sm:h-[7dvh]">
                    <nav></nav>
                </header>
                <main class="min-h-dvh sm:min-h-[93dvh] grid grid-cols-1 grid-rows-8">
                    <div class="row-span-2 lg:row-span-1 bg-purple-900"></div>
                    <div class="row-span-4 lg:row-span-6 bg-purple-800"></div>
                    <div class="row-span-2 lg:row-span-1 bg-purple-900"></div>
                </main>
                <section class="min-h-dvh bg-indigo-900"></section>
                <section class="min-h-dvh bg-cyan-900"></section>
                <section class="min-h-dvh bg-lime-900"></section>
                <section class="min-h-dvh bg-yellow-900"></section>
                <section class="min-h-dvh bg-orange-900"></section>
                <section class="min-h-dvh bg-red-900"></section>
                <footer class="min-h-[35dvh]"></footer>
            </div>
            <aside class="sticky top-0 sm:col-span-2 sm:max-h-dvh bg-amber-200"></aside>
        </div>
    </body>
</html>
